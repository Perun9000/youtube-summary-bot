services:
  bot:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8799:8799"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # PO-token provider для yt-dlp-плагина youtubepot-bgutilhttp (см.
  # app/config.py Settings.pot_provider_url, app/youtube_service.py
  # _add_pot_provider_option). Без публикации портов наружу — доступен
  # боту только внутри compose-сети по имени сервиса и порту 4416.
  bgutil-provider:
    # Пин на конкретный тег, а не :latest — детерминизм и синхронизация с
    # requirements.txt (bgutil-ytdlp-pot-provider>=1.3.2,<1.4): плагин и
    # сервер разъезжаются по мажор.минору → сервер логирует warning о
    # несовместимости (инцидент 2026-08-25).
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
